<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TempestRPG · Dependency roadmap</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0c1220;color:#e8edf7}
*{box-sizing:border-box}body{margin:0}header{padding:24px 28px;border-bottom:1px solid #293347;display:flex;gap:24px;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0 0 6px}p{line-height:1.6}header p{margin:0;color:#a5b2c8;font-size:13px}.legend{display:flex;gap:18px;font-size:12px;color:#b8c5da}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#6d7891}.done .dot,.dot.done{background:#47d5aa}.next .dot,.dot.next{background:#b19aff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 104px)}.graph-area{overflow:auto;position:relative;background:radial-gradient(#273149 1px,transparent 1px);background-size:24px 24px}.toolbar{position:sticky;top:0;z-index:3;padding:14px;background:#0c1220e8;display:flex;gap:8px;align-items:center}.toolbar button,.related{border:1px solid #3c4960;background:#192236;color:#e8edf7;padding:8px 12px;border-radius:8px;cursor:pointer}.toolbar span{font-size:12px;color:#a5b2c8;margin-left:8px}.canvas{width:860px;height:1445px;position:relative;transform-origin:top left}.stage{position:relative}svg{position:absolute;inset:0;pointer-events:none;width:860px;height:1445px}.edge{stroke:#3c4b66;stroke-width:2;fill:none}.edge.active{stroke:#c5b3ff;stroke-width:3}.node{position:absolute;width:240px;min-height:64px;display:flex;align-items:center;text-align:left;gap:5px;padding:16px 18px;background:#182238;border:1px solid #3b4b66;color:#e8edf7;border-radius:12px;font:600 14px/1.4 system-ui;cursor:pointer;box-shadow:0 8px 25px #0003}.node.done{border-color:#287c69}.node.next{border-color:#b19aff;box-shadow:0 0 0 3px #b19aff18}.node:hover,.node:focus-visible,.node.selected{outline:2px solid #c5b3ff;outline-offset:3px;background:#24304a}.node .dot{flex-shrink:0}.details{padding:28px 24px;overflow:auto;border-left:1px solid #293347;background:#111a2b}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#b19aff}.details h2{font-size:24px;line-height:1.25;margin:12px 0}.status{font-size:12px;color:#a5b2c8}.details h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#93a6c4;margin:26px 0 8px}.details p{font-size:14px;margin:0;white-space:pre-line}.related{display:block;text-align:left;margin:7px 0;width:100%;font-size:13px}.note{font-size:12px!important;color:#91a2bd;margin-top:30px!important}button:focus-visible{outline:2px solid #c5b3ff;outline-offset:3px}@media(max-width:800px){header{padding:18px;flex-wrap:wrap}.layout{display:flex;flex-direction:column;height:auto}.graph-area{height:65vh}.details{border-left:0;border-top:1px solid #293347;min-height:35vh}.legend{gap:12px}.toolbar span{display:none}}
</style>
</head>
<body>
<header><div><h1>TempestRPG</h1><p>Dependency roadmap · Follow the arrows to see what unlocks next</p></div><div class="legend"><span><i class="dot done"></i>Done</span><span><i class="dot next"></i>Next</span><span><i class="dot"></i>Planned</span></div></header>
<main class="layout"><section class="graph-area" aria-label="Interactive dependency graph"><div class="toolbar"><button id="next">Go to next task</button><button id="out" aria-label="Zoom out">−</button><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit width</button><span>Hover to preview · Click to pin details</span></div><div class="stage"><div class="canvas"><svg aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7183a3"/></marker></defs><g id="edges"></g></svg><div id="nodes"></div></div></div></section><aside class="details" aria-label="Task details" aria-live="polite"></aside></main>
<script id="roadmap-data" type="application/json">__ROADMAP_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('roadmap-data').textContent);
const nodes=data.nodes, byId=new Map(nodes.map(n=>[n.id,n]));
const graphHeight=Math.max(...nodes.map(n=>n.y))+130;
const area=document.querySelector('.graph-area'),canvas=document.querySelector('.canvas'),stage=document.querySelector('.stage'),panel=document.querySelector('.details');
let pinned=nodes.find(n=>n.status==='next')?.id||nodes[0].id, scale=1;
canvas.style.height=graphHeight+'px';document.querySelector('svg').style.height=graphHeight+'px';
const buttons=new Map();
function element(tag,text,className){const e=document.createElement(tag);if(text)e.textContent=text;if(className)e.className=className;return e;}
const successors=id=>nodes.filter(n=>n.deps.includes(id));
function select(id,pin=false){
 if(pin)pinned=id;
 const n=byId.get(id);panel.replaceChildren();
 panel.append(element('div',n.phase,'eyebrow'),element('h2',n.title),element('div',n.status.toUpperCase()+' · Updated '+data.updated,'status'));
 for(const [title,body] of [['What it is',n.what],['Why we need it',n.why],['Done when',n.evidence]])panel.append(element('h3',title),element('p',body));
 for(const [title,list,empty] of [['Needs first',n.deps.map(id=>byId.get(id)),'No prerequisites.'],['Comes after',successors(id),'Final planned milestone; review scope after validation.']]){
  panel.append(element('h3',title));
  if(!list.length)panel.append(element('p',empty));
  for(const related of list){const b=element('button',related.title,'related');b.onclick=()=>{select(related.id,true);buttons.get(related.id).scrollIntoView({block:'center',inline:'center',behavior:'smooth'});};panel.append(b);}
 }
 panel.append(element('p','Status reflects verified work. This view is generated from ROADMAP.md and refreshed when we update the project.','note'));
 buttons.forEach((b,key)=>{b.classList.toggle('selected',key===id);b.setAttribute('aria-pressed',String(key===pinned));});
 document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('active',e.dataset.from===id||e.dataset.to===id));
}
for(const n of nodes){
 for(const dep of n.deps){
  const from=byId.get(dep),p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const x1=from.x+120,y1=from.y+64,x2=n.x+120,y2=n.y,mid=(y1+y2)/2;
  p.setAttribute('d',from.y===n.y ? `M ${from.x+240} ${from.y+32} L ${n.x-6} ${n.y+32}` : `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2-6}`);
  p.setAttribute('class','edge');p.setAttribute('marker-end','url(#arrow)');p.dataset.from=dep;p.dataset.to=n.id;document.getElementById('edges').append(p);
 }
 const b=element('button','',`node ${n.status}`);b.style.left=n.x+'px';b.style.top=n.y+'px';b.dataset.id=n.id;
 b.append(element('i','','dot'),element('span',n.title));b.setAttribute('aria-label',n.title+' — '+n.status);
 b.onmouseenter=()=>select(n.id);b.onmouseleave=()=>select(pinned);b.onfocus=()=>select(n.id);b.onblur=e=>{if(!panel.contains(e.relatedTarget))select(pinned);};b.onclick=()=>select(n.id,true);
 document.getElementById('nodes').append(b);buttons.set(n.id,b);
}
function zoom(value){scale=Math.min(1.5,Math.max(.4,value));canvas.style.transform=`scale(${scale})`;stage.style.width=860*scale+'px';stage.style.height=graphHeight*scale+'px';}
document.getElementById('in').onclick=()=>zoom(scale+.1);document.getElementById('out').onclick=()=>zoom(scale-.1);
document.getElementById('fit').onclick=()=>zoom((area.clientWidth-24)/860);
document.getElementById('next').onclick=()=>{const n=nodes.find(n=>n.status==='next')||nodes.find(n=>n.status!=='done'&&n.deps.every(d=>byId.get(d).status==='done'));if(n){select(n.id,true);buttons.get(n.id).scrollIntoView({block:'center',inline:'center',behavior:'smooth'});}};
zoom(Math.min(1,(area.clientWidth-24)/860));select(pinned,true);
</script>
</body>
</html>
