 implemented player/entity/world state, reserved character/shared progression dictionaries, and restoration tests. Extend validated schemas as new gameplay systems are added.\nCompleted: authoritative movement/combat/rewards and concurrent-claim validation without duplicated loot or skill/material awards.\nCompleted: local HUD/inventory binding and per-character menu input blocking; shared simulation continues.\nPassed: 68 real-process networking checks and 32 persistence checks; one host plus seven guests, ninth-player rejection, save/reload/reconnect, invalid credentials, corrupt save recovery. LAN/WAN, encryption, latency and visual playtests remain future validation.", "why": "Host friends on the user's machine and preserve each character and shared world before deeper progression.", "evidence": "verified locally with 8-player capacity and restored character/world state; real network deployment remains a follow-up check.", "x": 300, "y": 1295, "phase": "N0"}, {"id": "M1", "title": "Combat and absorption", "status": "done", "deps": ["skill_ui"], "what": "Completed: player health, directional basic attack, chasing enemy, telegraphed bite, damage immunity, defeat, and restart (24 checks passed).\nCompleted: shared Magicules, aura-strike spending, delayed regeneration, numeric/bar HUD, depletion and recovery (27 checks passed).\nCompleted user-requested addition: difficulty-scaled Magicule drops with proximity collection and overflow preservation (32 checks passed).\nCompleted: defeated-creature absorption, timed analysis, and acquisition of Common Skill Rending Bite (26 checks passed).\nCompleted: three hotbar slots, Rending Bite activation, shared attack cooldown, bounded material stacks, paused inventory UI, and System Voice/event-log feedback (35 checks passed).", "why": "Establish the distinctive fight → absorb → acquire → use loop before expanding progression.", "evidence": "movement → combat → defeat → absorption → skill use works end to end.", "x": 300, "y": 1180, "phase": "M1"}, {"id": "M2", "title": "First ally and naming", "status": "done", "deps": ["naming_evolution"], "what": "Completed: recruit a nameless goblin after defeating the clearing threat; stable ownership, follow behavior, host-only claims and save/reconnect (18 ally checks plus network coverage).\nCompleted: cost preview and explicit confirmation, 80-Magicule naming, owner/range/name validation and single evolution.\nCompleted: Goblin → Hobgoblin, stats/silhouette changes, minimum 8-second sleep below 25% reserves, recovery at 25%.\nCompleted: schema-v3 migration, saved/replicated ally evolution and per-character exhaustion, including respawn without bypassing sleep; 28 naming and 86 network checks passed.", "why": "Turn progression into relationships, with meaningful Magicule costs and persistent evolution.", "evidence": "naming has a meaningful cost, evolution persists, and depletion cannot be bypassed by reload.", "x": 300, "y": 1640, "phase": "M2"}, {"id": "M3", "title": "First settlement", "status": "done", "deps": ["camp_growth"], "what": "Completed first structure: found a camp with your evolved ally nearby; gather finite wood/stone into shared stock and build one Goblin Hut for 12 wood + 6 stone.\nVerified: one transaction per deposit/structure, safe placement and collision, schema-v4 migration and host restart/client replication (34 local + 42 camp networking checks). Additional structures follow after the work-role loop.\nCompleted: owner commands for timed automatic gathering, hut construction and recall; job/target/timer save and replication, autonomous work while owner disconnects. Agriculture remains future work.\nCompleted: exploration rewards feed camp growth — outlying player-only deposits, Gnasher Essence offerings, Storehouse and Essence Shrine recipes with real effects, camp level, schema-v6 migration (48 growth checks, 105 camp network checks).\nCompleted: visible automated playtest of the full slice on Windows (`tests/visual_playtest.gd`, 22 screenshots in `docs/playtest/`); 640×360 base resolution; HUD/menu readability fixes. Agriculture moves to later settlement work.", "why": "Connect adventure rewards and evolved allies to a functioning camp; complete the first playable slice.", "evidence": "a complete playable slice from exploration to an evolved ally contributing to the camp.", "x": 300, "y": 2100, "phase": "M3"}, {"id": "M4", "title": "Progression and presentation", "status": "next", "deps": ["m4_24"], "what": "Expand skill data across Common, Extra, Unique, and Ultimate tiers with explicit unlock rules.\nAdd selected skill combinations and an initial mimic form. (User, 2026-10-13: the analysis assistant is scrapped; skills fuse in a drag-and-drop fusion window instead.)\nAdd three playable races (Human, Demon, Slime), experience/levels with a per-race skill tree, and gear: armor, accessories and weapons (sword, spear, scythe, bow) with looks, rarities, stats and higher-rarity passives/actives.\nDevelop original regions, factions, sprites, audio, and combat VFX.\nBalance naming costs, skill acquisition, and recovery against actual playtests.", "why": "Test and polish the small playable slice before scaling the simulation and content.", "evidence": "the core slice is readable, enjoyable, and balanced before adding world scale.", "x": 300, "y": 3710, "phase": "M4"}, {"id": "M5", "title": "Nation building and diplomacy", "status": "planned", "deps": ["M4"], "what": "Expand settlement services, citizen roles, trade routes, and faction relationships.\nAdd currency and merchants that sell gear (user decision 2026-10-13: gear also comes from merchants).\nAdd emissaries, diplomatic choices, and consequences.\nIntroduce settlement threats and a small defensive siege.", "why": "Give settlement growth external consequences through trade, factions, and conflict.", "evidence": "economy and diplomacy change the outcome of a playable conflict.", "x": 300, "y": 3825, "phase": "M5"}, {"id": "M6", "title": "Armies and endgame", "status": "planned", "deps": ["M5"], "what": "Introduce squad commands, evolved citizen units, and larger invasions.\nDevelop major ascensions, Ultimate Skills, and apex encounters.\nValidate performance, progression pacing, accessibility, and save compatibility.", "why": "Extend a proven economy and combat loop into squad warfare and endgame progression.", "evidence": "late-game combat and nation management extend the established core loop reliably.", "x": 300, "y": 3940, "phase": "M6"}, {"id": "M4.5", "title": "World and item expansion (user requests, 2026-10-13)", "status": "planned", "deps": ["m4_17g"], "what": "Requested by the user after 17e; exact order and scope to be confirmed with the user before each step. References: the user pointed at the Farever database and the Siagarta map (metaforge.app) as **inspiration only** — categories, item structure, stat/rarity curves and the overall world theme may guide us; names, descriptions, images and the exact map are our own (user agreed: no 1:1 copies).\n- **World map:** an archipelago of distinct biome regions (lush main island with a central lake fortress, dense forest and rocky crater highlands; a walled-town island; a large autumn/savanna continent with ruins and a harbour; small volcanic islets), connected by bridges and open sea, with original names. The current clearing becomes the starting region.\n- **Sea travel:** ferry NPCs on the coast of each region take you across for **currency or quest vouchers**; you can also **buy or craft your own ship** and sail it. Needs currency (merchants/trade), quests (vouchers) and the region map.\n- **More item categories:** tools (gathering), materials (expanded), consumables, mounts, runes and augments (socketed upgrades for gear), plus the jewellery/weapons already planned — original content benchmarked against the reference's stat curves.\n- Exit goal: several regions reachable by ferry and by player ship, with the new item categories obtainable and saved.", "why": "Expand the proven gear and exploration systems into original regions and travel.", "evidence": "Planned only; implementation order awaits user confirmation. Currency/quest-dependent travel needs those systems first.", "x": 300, "y": 4055, "phase": "M4.5"}], "updated": "2026-10-13"}</script>
<script>
const data=JSON.parse(document.getElementById('roadmap-data').textContent);
const nodes=data.nodes, byId=new Map(nodes.map(n=>[n.id,n]));
const graphHeight=Math.max(...nodes.map(n=>n.y))+130;
const area=document.querySelector('.graph-area'),canvas=document.querySelector('.canvas'),stage=document.querySelector('.stage'),panel=document.querySelector('.details');
let pinned=nodes.find(n=>n.status==='next')?.id||nodes[0].id, scale=1;
canvas.style.height=graphHeight+'px';document.querySelector('svg').style.height=graphHeight+'px';
const buttons=new Map();
function element(tag,text,className){const e=document.createElement(tag);if(text)e.textContent=text;if(className)e.className=className;return e;}
const successors=id=>nodes.filter(n=>n.deps.includes(id));
function select(id,pin=false){
 if(pin)pinned=id;
 const n=byId.get(id);panel.replaceChildren();
 panel.append(element('div',n.phase,'eyebrow'),element('h2',n.title),element('div',n.status.toUpperCase()+' · Updated '+data.updated,'status'));
 for(const [title,body] of [['What it is',n.what],['Why we need it',n.why],['Done when',n.evidence]])panel.append(element('h3',title),element('p',body));
 for(const [title,list,empty] of [['Needs first',n.deps.map(id=>byId.get(id)),'No prerequisites.'],['Comes after',successors(id),'Final planned milestone; review scope after validation.']]){
  panel.append(element('h3',title));
  if(!list.length)panel.append(element('p',empty));
  for(const related of list){const b=element('button',related.title,'related');b.onclick=()=>{select(related.id,true);buttons.get(related.id).scrollIntoView({block:'center',inline:'center',behavior:'smooth'});};panel.append(b);}
 }
 panel.append(element('p','Status reflects verified work. This view is generated from ROADMAP.md and refreshed when we update the project.','note'));
 buttons.forEach((b,key)=>{b.classList.toggle('selected',key===id);b.setAttribute('aria-pressed',String(key===pinned));});
 document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('active',e.dataset.from===id||e.dataset.to===id));
}
for(const n of nodes){
 for(const dep of n.deps){
  const from=byId.get(dep),p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const x1=from.x+120,y1=from.y+64,x2=n.x+120,y2=n.y,mid=(y1+y2)/2;
  p.setAttribute('d',from.y===n.y ? `M ${from.x+240} ${from.y+32} L ${n.x-6} ${n.y+32}` : `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2-6}`);
  p.setAttribute('class','edge');p.setAttribute('marker-end','url(#arrow)');p.dataset.from=dep;p.dataset.to=n.id;document.getElementById('edges').append(p);
 }
 const b=element('button','',`node ${n.status}`);b.style.left=n.x+'px';b.style.top=n.y+'px';b.dataset.id=n.id;
 b.append(element('i','','dot'),element('span',n.title));b.setAttribute('aria-label',n.title+' — '+n.status);
 b.onmouseenter=()=>select(n.id);b.onmouseleave=()=>select(pinned);b.onfocus=()=>select(n.id);b.onblur=e=>{if(!panel.contains(e.relatedTarget))select(pinned);};b.onclick=()=>select(n.id,true);
 document.getElementById('nodes').append(b);buttons.set(n.id,b);
}
function zoom(value){scale=Math.min(1.5,Math.max(.4,value));canvas.style.transform=`scale(${scale})`;stage.style.width=860*scale+'px';stage.style.height=graphHeight*scale+'px';}
document.getElementById('in').onclick=()=>zoom(scale+.1);document.getElementById('out').onclick=()=>zoom(scale-.1);
document.getElementById('fit').onclick=()=>zoom((area.clientWidth-24)/860);
document.getElementById('next').onclick=()=>{const n=nodes.find(n=>n.status==='next')||nodes.find(n=>n.status!=='done'&&n.deps.every(d=>byId.get(d).status==='done'));if(n){select(n.id,true);buttons.get(n.id).scrollIntoView({block:'center',inline:'center',behavior:'smooth'});}};
zoom(Math.min(1,(area.clientWidth-24)/860));select(pinned,true);
</script>
</body>
